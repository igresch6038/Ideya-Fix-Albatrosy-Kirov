services:
  postgres:
    image: postgres:16-alpine
    container_name: bot-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kvanto_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kvanto_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/igresch6038/idea-fix-albatrosy-kirov:latest
    container_name: bot-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/kvanto_bot
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    env_file:
      - .env

  bot:
    image: ghcr.io/igresch6038/idea-fix-albatrosy-kirov:latest
    container_name: main-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: node bot.js
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/kvanto_bot
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    env_file:
      - .env

volumes:
  pgdata:
